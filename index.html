<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div id="headbar">
        <div>
          <img class="headbar-icon" id="logo" src="./images/logo.svg" />
          <h1>WhatsApp</h1>
        </div>
        <div>
          <img class="headbar-icon" src="./images/minimize.svg" />
          <img class="headbar-icon" src="./images/maximize.svg" />
          <img class="headbar-icon" src="./images/close.svg" />
        </div>
      </div>
      <div id="profilebar">
        <img
          class="profile-picture"
          src="./images/human1.jpg"
          alt="profile picture"
        />
        <div>
          <img class="headbar-icon" src="./images/plus.svg" />
          <img class="headbar-icon" src="./images/three_dots.svg" />
        </div>
      </div>
      <div id="chatbar">
        <div class="picture-name">
          <img
            class="profile-picture"
            src="./images/tulips.jpg"
            alt="profile picture"
          />
          <div>
            <h2>Whitmans Chat</h2>
            <p>Alice, Francis, Jack, Margot, Peter, Royal, Zissou</p>
          </div>
        </div>
        <div>
          <img class="headbar-icon" src="./images/paperclip.svg" />
          <img class="headbar-icon" src="./images/three_dots.svg" />
        </div>
      </div>
      <div class="searchbar">SEARCHBAR</div>
      <div class="list">LIST</div>
      <div class="chatwindow">CHATWINDOW</div>
      <div class="textbar">TEXTBAR</div>
    </main>
  </body>
</html>
